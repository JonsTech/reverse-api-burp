plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'io.github.reverseapi'
version = '1.0.0'

repositories { mavenCentral() }

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    implementation 'com.google.re2j:re2j:1.8'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

jar { enabled = false }

shadowJar {
    archiveBaseName = 'ReverseAPI'
    archiveClassifier = ''
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Implementation-Title': 'Reverse API',
                'Implementation-Version': project.version,
                'Extension-API': 'Montoya 2026.7'
    }
}

build.dependsOn shadowJar

// Keep the directly loadable artifact complete without bundling Burp's API.
tasks.register('verifyReleaseJar') {
    dependsOn shadowJar
    doLast {
        def artifact = tasks.shadowJar.archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            assert !names.any { it.startsWith('burp/api/montoya/') } : 'Montoya API must not be bundled'
            ['io/github/reverseapi/ReverseApiExtension.class',
             'com/fasterxml/jackson/databind/ObjectMapper.class',
             'com/fasterxml/jackson/core/JsonFactory.class',
             'com/fasterxml/jackson/annotation/JsonProperty.class',
             'com/fasterxml/jackson/dataformat/yaml/YAMLFactory.class',
             'org/yaml/snakeyaml/Yaml.class', 'com/google/re2j/Pattern.class'].each {
                assert names.contains(it) : "Missing runtime class: $it"
            }
        }
    }
}
check.dependsOn verifyReleaseJar
